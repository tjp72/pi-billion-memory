name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repository; the default token scope is broader than that.
permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The privacy keyword list is a secret: §1 requires it to stay out of the tree. When it is
    # unset the scan still enforces its structural rules (home paths, emails, tokens).
    env:
      PBM_PRIVACY_TERMS: ${{ secrets.PBM_PRIVACY_TERMS }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22.19", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      # Named separately so a privacy or language failure is visible as its own red check
      # instead of being buried in the composite gate.
      - name: Privacy scan (AGENTS.md §1)
        run: npm run privacy:scan

      - name: Language check (AGENTS.md §2)
        run: npm run language:check

      - name: Check
        run: npm run check

      - name: E2E dist smoke test
        run: npm run e2e

      - name: Verify committed dist
        run: npm run verify:dist
