name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Check
        run: npm run check

      - name: E2E dist smoke test
        run: npm run e2e

      - name: Ensure package is publishable
        run: |
          node -e "const p=require('./package.json'); if (p.private) { console.error('package.json has private: true; remove it before publishing'); process.exit(1); }"

      # `--provenance` requires a public repository. After the repository is
      # made public, change the publish command to:
      #   npm publish --access public --provenance
      # `NPM_TOKEN` must be configured as a repository secret.
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
