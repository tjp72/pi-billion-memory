name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repository; the default token scope is broader than that.
permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22.19", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Check
        run: npm run check

      - name: E2E dist smoke test
        run: npm run e2e

      - name: Verify committed dist
        run: npm run verify:dist
